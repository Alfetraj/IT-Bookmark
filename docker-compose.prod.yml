version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: it_bookmark_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-it_bookmark}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_bookmark}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - it_bookmark_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: it_bookmark_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-it_bookmark}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - it_bookmark_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: it_bookmark_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - it_bookmark_network

networks:
  it_bookmark_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
